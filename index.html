<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบเช็คสินค้า — ร้านวงเวียน</title>
<style>
  :root{
    --ink:#16232e; --ink-soft:#5a6b74; --paper:#fffdf8;
    --desk:#e2e7e3; --desk-edge:#cdd5d0; --go:#1f6f5c; --stamp:#b4302a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--desk);color:var(--ink);
    font-family:"Sarabun","Segoe UI",system-ui,sans-serif;
    padding:24px;
  }
  .card{
    width:100%;max-width:420px;background:var(--paper);
    border-radius:6px;padding:32px 28px;
    box-shadow:0 1px 0 var(--desk-edge),0 14px 30px rgba(22,35,46,.13);
  }
  h1{font-size:20px;margin:0 0 4px}
  p.sub{color:var(--ink-soft);font-size:14px;margin:0 0 24px}
  a.btn{
    display:block;text-align:center;padding:14px;margin-bottom:12px;
    border:1px solid var(--ink);border-radius:4px;
    color:var(--ink);text-decoration:none;font-weight:600;font-size:15px;
  }
  a.btn:hover{background:var(--ink);color:#fff}
  a.btn.go{background:var(--go);border-color:var(--go);color:#fff}
  a.btn.go:hover{background:#175344}
  a.btn small{display:block;font-weight:400;font-size:12.5px;opacity:.8;margin-top:2px}
</style>
</head>
<body>
  <div class="card">
    <h1>ระบบเช็คสินค้า → ใบสั่งของ</h1>
    <p class="sub">ร้านวงเวียน — เลือกหน้าที่จะใช้</p>
    <a class="btn go" href="stock_pc.html">
      หน้าคอม
      <small>ตั้งลิสต์ · รับผล · วางแผน · ใบส่งเซล</small>
    </a>
    <a class="btn" href="stock_mobile.html">
      หน้ามือถือ
      <small>ใส่รหัสรอบ แล้วกรอกจำนวนที่นับได้</small>
    </a>
  </div>
</body>
</html>
